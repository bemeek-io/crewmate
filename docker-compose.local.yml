# Local testing override: no TLS proxy, app published directly on :8080.
# Push + service worker still work in desktop browsers because localhost is a
# secure context. iPhones require real HTTPS (use a tunnel — see README).
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
services:
  app:
    ports: !override
      - "8080:8080"
    environment:
      TRUST_PROXY: "false"
  proxy:
    deploy:
      replicas: 0
